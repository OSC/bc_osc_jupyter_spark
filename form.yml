---
cluster:
  - "pitzer"
  - "ascend"
  - "cardinal"
form:
  - auto_accounts
  - jupyterlab_switch
  - working_dir
  - auto_modules_spark
  - auto_modules_python
  - global_job_type
  - bc_num_nodes
  - global_num_cores
  - global_enable_mem
  - global_mem
  - bc_num_hours
  - global_gpus
  - global_gpu_type
  # - Spark configuration -
  - num_workers
  - spark_configuration_file
  - supplement_env_file
  - only_driver_on_root
  - include_tutorials
  # - Spark configuration -
  - bc_email_on_started
  - auto_modules_app_jupyter
  - global_default_values     # required if the global_job_type is used
attributes:
  global_num_cores:
    hide_by_default: true
  global_gpus:
    help: |
      **<span style="color:#ba0c2f">Note that GPU count setting will be ignored because the entire node will be allocated.</span>**
  auto_modules_spark:
    default: false
  auto_modules_app_jupyter:
    label: "JupyterLab version"
    default: false
  auto_modules_python:
    default: false
    help: | 
      Specify the Python version to match the one used in your Conda environment.
      This ensures compatibility when setting up the Spark cluster and helps prevent issues related
      to Python version mismatches.
  num_workers:
    widget: "number_field"
    value: "1"
    min: "1"
    label: "Number of workers per node"
    help: |
      This describes how the cores and memory are divided up on the node
      (*useful to reduce memory allocated for each worker*). Should be a
      multiple of the number of cores on the node you chose above. Do **NOT**
      exceed the number of cores on the node.
  spark_configuration_file:
    widget: "path_selector"
    label: "Spark configuration file"
    show_hidden: false
    show_files: true
    help: "Override defaults with a new configuration file. Leave blank to use defaults."
  supplement_env_file:
    widget: "path_selector"
    label: "Supplementary environment variables file"
    show_hidden: false
    show_files: true
    help: "Load additional environment variables from a file before starting the Spark cluster."
  only_driver_on_root:
    widget: "check_box"
    label: Only launch the driver on the master node.
    help: |
      This is typically used for `.collect` and `.take` operations that require
      a large amount of memory allocated (> 2GB) for the driver process.
  include_tutorials:
    widget: "check_box"
    label: Include access to OSC tutorial/workshop notebooks.
  jupyterlab_switch:
    widget: "check_box"
    label: "Use JupyterLab instead of Jupyter Notebook?"
    value: "1"
    help: |
      JupyterLab is the next generation of Jupyter, and is completely compatible with existing Jupyter Notebooks.
  working_dir:
    widget: "path_selector"
    label: "Root Directory"
    show_hidden: false
    show_files: false   # Only display directories
    help: "Select your project directory; defaults to $HOME"
